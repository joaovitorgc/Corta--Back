```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cortaê</title>
</head>

<body style="
    margin: 0;
    padding: 0;
    background-color: #f4f4f4;
    font-family: Arial, Helvetica, sans-serif;
">

    <div style="
        max-width: 600px;
        margin: 40px auto;
        background-color: #ffffff;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 0 10px rgba(0,0,0,0.10);
    ">

        <!-- CABEÇALHO -->

        <div style="
            background-color: #000000;
            padding: 30px;
            text-align: center;
        ">

            <h1 style="
                margin: 0;
                color: #ffffff;
                font-size: 30px;
                font-weight: bold;
            ">
                Cortaê
            </h1>

        </div>


        <!-- CONTEÚDO -->

        <div style="
            padding: 40px 30px;
        ">

            <h2 style="
                margin: 0 0 20px 0;
                color: #333333;
                text-align: center;
                font-size: 24px;
            ">
                Olá, {{nome}}!
            </h2>


            <p style="
                margin: 0 0 20px 0;
                color: #555555;
                font-size: 16px;
                line-height: 1.6;
                text-align: center;
            ">
                {{mensagem}}
            </p>


            <!-- CÓDIGO -->

            <div style="
                margin: 30px 0;
                padding: 15px;
                background-color: #d57c15;
                border-radius: 8px;
                text-align: center;
            ">

                <span style="
                    color: #ffffff;
                    font-size: 32px;
                    font-weight: bold;
                    letter-spacing: 8px;
                ">
                    {{codigo}}
                </span>

            </div>


            <p style="
                margin: 0 0 20px 0;
                color: #555555;
                font-size: 15px;
                line-height: 1.6;
                text-align: center;
            ">
                {{mensagem_secundaria}}
            </p>


            <p style="
                margin: 25px 0 0 0;
                color: #999999;
                font-size: 13px;
                line-height: 1.5;
                text-align: center;
            ">
                Se você não reconhece essa ação, ignore este email.
            </p>

        </div>


        <!-- RODAPÉ -->

        <div style="
            padding: 20px;
            background-color: #eeeeee;
            text-align: center;
        ">

            <p style="
                margin: 0;
                color: #777777;
                font-size: 12px;
            ">
                © 2026 Cortaê
            </p>

        </div>

    </div>

</body>

</html>
